{{- $publicExposureEnabled := or .Values.ingress.enabled .Values.gateway.enabled -}}
{{- /* Session cookies are signed with this secret, so a known value lets anyone forge a session however the service is exposed. */ -}}
{{- if and (not .Values.kaneo.env.existingSecret.enabled) (eq .Values.kaneo.env.authSecret "change_me_to_at_least_32_characters_long_string") -}}
{{- fail "kaneo.env.authSecret must be changed from the old example value or provided via kaneo.env.existingSecret" -}}
{{- end -}}
{{- if and (not .Values.kaneo.env.existingSecret.enabled) (lt (len (.Values.kaneo.env.authSecret | toString)) 32) -}}
{{- fail "kaneo.env.authSecret must be at least 32 characters (openssl rand -hex 32) or provided via kaneo.env.existingSecret" -}}
{{- end -}}
{{- if and $publicExposureEnabled .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) (eq .Values.postgresql.auth.password "kaneo_password") -}}
{{- fail "postgresql.auth.password must be changed or provided via postgresql.auth.existingSecret before enabling ingress or gateway" -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled .Values.autoscaling.targetCPUUtilizationPercentage (not (dig "requests" "cpu" "" .Values.kaneo.resources)) -}}
{{- fail "kaneo.resources.requests.cpu must be set when autoscaling CPU utilization is enabled" -}}
{{- end -}}
